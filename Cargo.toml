[package]
name = "mojique"
version = "0.1.1"
description = "A safe Rust wrapper and pool implementation around libmagic"
license = "MIT"
repository = "https://github.com/LawnGnome/mojique"
edition = "2024"
rust-version = "1.88"

[dependencies]
magic-sys = { version = "0.4.3", default-features = false }
static_assertions = "1.1.0"
thiserror = "2.0.21"

[dev-dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
insta = "1.49.0"
itertools = "0.15.0"
rayon = "1.12.0"

[features]
# It's unfortunate that we have to replicate magic-sys's dependency tree here,
# but we have to in order to have flags be enabled or disabled correctly with
# `cfg` directives.
default = ["magic-sys/default"]
pkg-config = ["magic-sys/pkg-config"]
vcpkg = ["magic-sys/vcpkg"]
v5-40 = ["magic-sys/v5-40"]
v5-44 = ["magic-sys/v5-44", "v5-40"]
v5-45 = ["magic-sys/v5-45", "v5-44"]
v5-46 = ["magic-sys/v5-46", "v5-45"]
